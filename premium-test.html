<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天命の導き｜数秘術テスト</title>
<style>
body{background:#17132d;color:#f4e7cb;font-family:sans-serif;padding:24px;line-height:1.8}
h1{color:#eac47a;font-size:24px}
input,button{font-size:18px;padding:14px;border-radius:10px;max-width:100%;box-sizing:border-box}
button{background:#eac47a;color:#17132d;border:0;margin-top:15px;font-weight:bold}
#result{margin-top:25px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>天命の導き</h1>
<p>数秘術・計算テスト</p>
<label for="birthday">生年月日</label>
<input type="date" id="birthday" value="1976-03-14">
<br>
<label for="timeKnown">出生時刻</label>
<select id="timeKnown" onchange="document.getElementById('birthtimeBox').style.display=this.value==='yes'?'block':'none'">
  <option value="no">わからない</option>
  <option value="yes">わかるので入力する</option>
</select>
<div id="birthtimeBox" style="display:none;margin-top:12px;">
  <input type="time" id="birthtime">
</div>
<p style="font-size:13px;color:#bcb4d0;">
  出生時刻が不明でも鑑定できます
</p>
<br>
<button id="testButton">鑑定計算をテスト</button>
<div id="result"></div>
<script src="./premium.js?v=solar20261028e"></script>
<button onclick="
const d = shichuCalculateSetsuiri(2024, 2);
alert(d ? '2024年立春（日本時間）: ' +
  d.toLocaleString('ja-JP', {timeZone:'Asia/Tokyo'})
  : '計算できませんでした');
">立春の自動計算テスト</button>
<button onclick="
const d = new Date('2024-02-04T08:27:00Z');
const oldValue = shichuSolarLongitude(d);
const newValue = shichuSolarLongitudeTT(d);
alert(
  '2024年2月4日 17:27 JST\n' +
  '従来の太陽黄経: ' + oldValue.toFixed(6) + '度\n' +
  'ΔT考慮後: ' + newValue.toFixed(6) + '度\n' +
  '立春の目標: 315度'
);
">太陽黄経の比較テスト</button>
<button onclick="
const d = new Date('2024-02-04T08:27:00Z');
const r = shichuCompareSolarLongitude(d);

alert(r
  ? '2024年2月4日 17:27 JST\n' +
    '補正前：' + r.original.toFixed(6) + '度\n' +
    '補正量：' + r.correction.toFixed(6) + '度\n' +
    '補正後：' + r.corrected.toFixed(6) + '度\n' +
    '目標：315度'
  : '計算できませんでした'
);
">補正前後の比較テスト</button>
<script>
document.getElementById("testButton").addEventListener("click",function(){
const output=document.getElementById("result");
try{
  
const selectedTimeKnown = document.getElementById("timeKnown").value;
const selectedBirthtime = selectedTimeKnown === "yes"
  ? document.getElementById("birthtime").value
  : null;

const birthdate=document.getElementById("birthday").value;
if(!birthdate){throw new Error("生年月日を選択してください");}
const data=calculateLifePath(birthdate); const maya=calculateMaya(birthdate); const zodiac=calculateZodiac(birthdate); const kyusei=calculateNineStar(birthdate);
output.textContent="計算成功！\n\n【数秘術】\nライフパスナンバー："+data.lifePathNumber+"\n\n【マヤ暦】\nKIN番号："+maya.kinNumber+"\n日の紋章："+maya.daySign+"\n音："+maya.tone;
output.textContent += "\n\n【西洋占星術】\n太陽星座：" + zodiac.zodiac;
output.textContent += "\n\n【九星気学】\n本命星：" + kyusei.star;

const shichu = calculateYearPillar(birthdate, selectedBirthtime);

output.textContent += "\n\n【四柱推命】\n年柱：" + (shichu.yearPillar ?? "要確認");
const monthData = calculateMonthPillar(birthdate, selectedBirthtime);
output.textContent += "\n月柱：" + (monthData.monthPillar ?? "要確認");
const dayData = calculateDayPillar(birthdate);
output.textContent += "\n日柱：" + dayData.dayPillar;
// 四柱推命：出生時刻による時柱の表示
const timeKnown = document.getElementById("timeKnown").value;

if (timeKnown === "yes") {
  const birthtime = document.getElementById("birthtime").value;

  if (!birthtime) {
    throw new Error("出生時刻を入力してください");
  }

  const hourData = calculateHourPillar(birthdate, birthtime);

  output.textContent += "\n時柱：" + hourData.hourPillar;

  if (hourData.needsVerification) {
    output.textContent += "（時刻境界のため要確認）";
  }
} else {
  output.textContent += "\n時柱：出生時刻不明のため省略";
}
}catch(error){
output.textContent="エラー："+error.message;
}
});
</script>
</body>
</html>
