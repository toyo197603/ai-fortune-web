
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天命の導き｜立春精度テスト</title>
<style>
body{font-family:-apple-system,sans-serif;padding:20px;background:#f5f6f8;color:#24344d}
h2{font-size:22px}
button{width:100%;padding:16px;background:#243f69;color:white;border:0;border-radius:10px;font-size:17px}
pre{background:white;padding:15px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<h2>立春当日の精度テスト</h2>
<p>2026年2月4日 05:02（日本時間）前後を確認します。</p>
<button onclick="run()">テスト実行</button>
<pre id="out">ボタンを押してください。</pre>
<script src="./tenmei-engine.js"></script>
<script>
function run(){
 const out=document.getElementById("out");
 try{
  const times=["00:00","03:00","05:01","05:02","05:03","07:00","23:59"];
  const results=times.map(time=>{
   const year=tenmeiCalculateYearPillarSafe("2026-02-04",time);
   const month=tenmeiCalculateMonthPillar("2026-02-04",time);
   return {
    time,
    yearStatus:year.status,
    yearPillar:year.pillar||"要確認",
    yearReason:year.reason||"",
    monthStatus:month.status,
    monthPillar:month.pillar||"要確認",
    monthReason:month.reason||""
   };
  });
  out.textContent=JSON.stringify(results,null,2);
 }catch(e){
  out.textContent="エラー: "+e.message;
 }
}
</script>
</body>
</html>
