
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI運命鑑定</title>
<style>
body{margin:0;background:#101025;color:white;font-family:sans-serif;padding:24px}
main{max-width:480px;margin:40px auto}
h1{text-align:center;color:#eac783}
p{text-align:center;color:#c9c4da}
label{display:block;margin-top:20px}
input,textarea{box-sizing:border-box;width:100%;padding:15px;margin-top:8px;border:1px solid #78669b;border-radius:10px;font-size:16px}
textarea{height:110px}
button{width:100%;padding:17px;margin-top:25px;background:#eac783;border:0;border-radius:12px;font-size:18px;font-weight:bold}
#result{white-space:pre-wrap;line-height:1.9;margin-top:28px}

/* AI運命鑑定 プレミアムデザイン */
body {
  background: linear-gradient(160deg,#101025,#201637);
  color: #f8f5ff;
  font-family: -apple-system, sans-serif;
}
main {
  max-width: 480px;
  margin: 35px auto;
  padding: 0 20px 60px;
}
h1 {
  color: #eac783;
  font-size: 30px;
  text-shadow: 0 0 20px #a77c4670;
}
#result {
  white-space: pre-wrap;
  line-height: 2;
  margin-top: 35px;
  padding: 24px 18px;
  background: #211b38;
  border: 1px solid #776044;
  border-radius: 18px;
  overflow-wrap: anywhere;
}
button {
  background: linear-gradient(120deg,#eac783,#c99a4b);
  color: #24182e;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
}
input, textarea {
  border-radius: 10px;
  padding: 12px;
  font-size: 16px;
}
  
</style>
</head>
<body>
<main>
<h1>✦ AI運命鑑定 ✦</h1>
<p>あなたの未来に、光を。</p>
<form id="form">
<label>お名前<input id="name" required></label>
<label>生年月日</label>
<div style="display:flex;gap:8px;">
  <select id="year" required style="width:42%;padding:12px;font-size:16px;">
    <option value="">年</option>
  </select>
  <select id="month" required style="width:29%;padding:12px;font-size:16px;">
    <option value="">月</option>
  </select>
  <select id="day" required style="width:29%;padding:12px;font-size:16px;">
    <option value="">日</option>
  </select>
</div>
<label>相談したいこと<textarea id="question" required></textarea></label>
<button id="submit">運命を鑑定する</button>
</form>
<div id="result" aria-live="polite"></div>

<div id="premium" style="display:none;margin-top:30px;padding:25px 18px;border:1px solid #eac783;border-radius:18px;background:#211b35;text-align:center;">
  <h2 style="color:#eac783;font-size:clamp(12px,4.6vw,24px);font-weight:800;text-align:center;white-space:nowrap;letter-spacing:-0.5px;margin:0 0 28px;text-shadow:0 0 15px #a77c4670;">さらに深く知りたいあなたへ</h2>
  <h2 style="color:#eac783;">✦ 本格運命鑑定 ✦</h2>
  <p style="color:white;">あなたの運命を、さらに深く。</p>
  <p style="color:#ddd;line-height:1.8;">
    3か月・半年・1年の運勢と、
    あなたに合わせた具体的な開運アドバイスをお届けします。
  </p>
  <h2 style="color:#eac783;">980円（税込）</h2>
  <button type="button" disabled>本格鑑定へ進む（準備中）</button>
  <p style="font-size:12px;color:#ccc;">買い切り・月額料金なし</p>
</div>

</main>
<script>
const yearSelect=document.getElementById("year");
const monthSelect=document.getElementById("month");
const daySelect=document.getElementById("day");
const currentYear=new Date().getFullYear();

for(let y=currentYear;y>=1900;y--){
  yearSelect.add(new Option(y+"年",y));
}
for(let m=1;m<=12;m++){
  monthSelect.add(new Option(m+"月",m));
}
function updateDays(){
  const previous=daySelect.value;
  daySelect.length=1;
  if(!yearSelect.value||!monthSelect.value)return;
  const max=new Date(Number(yearSelect.value),Number(monthSelect.value),0).getDate();
  for(let d=1;d<=max;d++){
    daySelect.add(new Option(d+"日",d));
  }
  if(previous&&Number(previous)<=max)daySelect.value=previous;
}
yearSelect.addEventListener("change",updateDays);
monthSelect.addEventListener("change",updateDays);
const API="https://ai-fortune-api.karen-nayuta-kanata.workers.dev/fortune";
document.getElementById("form").addEventListener("submit",async e=>{
e.preventDefault();
const btn=document.getElementById("submit");
const result=document.getElementById("result");
btn.disabled=true;
result.textContent="鑑定中です...";
try{
const response=await fetch(API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:document.getElementById("name").value,
birthday: `${yearSelect.value}-${monthSelect.value.padStart(2,"0")}-${daySelect.value.padStart(2,"0")}`,
question:document.getElementById("question").value,
plan:"free" 
})
});
if(!response.ok)throw Error("HTTP "+response.status);
const data=await response.json();
result.textContent=(data.fortune||"鑑定結果を取得できませんでした").split(/【さらに深く知りたいあなたへ】|【もっと深く知りたいあなたへ】/)[0].trim();
document.getElementById("premium").style.display = data.fortune ? "block" : "none";
}catch(err){
result.textContent="通信エラーが発生しました。APIの設定を確認してください。";
}finally{
btn.disabled=false;
}
});
</script>
</body>
</html>
