
<!DOCTYPE html>
<html lang="ja">
  <head>
<style>
/* 天命の導き・天空デザイン */
body {
  background:
    radial-gradient(ellipse at 50% 0%,
      rgba(218,170,89,.24),transparent 34%),
    radial-gradient(ellipse at 90% 55%,
      rgba(99,67,153,.28),transparent 55%),
    linear-gradient(160deg,#0b0a1b,#201635 75%,#100e23);
  background-attachment:fixed;
}
main {position:relative;z-index:1}
main::before {
  content:"✦";
  display:block;
  text-align:center;
  color:#f6d58e;
  font-size:52px;
  text-shadow:0 0 22px #e9ae55,0 0 55px #e9ae55;
  margin-bottom:12px;
}
h1 {
  color:#f6d58e!important;
  text-shadow:0 0 12px #d7a557,0 0 32px #9b713a!important;
}
input,textarea {
  border:1px solid #c9a05d!important;
  border-radius:12px!important;
}
#birthWheelPanel {
  background:
    radial-gradient(ellipse at 50% 0%,
      rgba(215,166,81,.19),transparent 65%),
    #211832!important;
  border-top:1px solid #d8ae65;
  box-shadow:0 -12px 55px #d5a25733;
}
#birthWheelPanel h3 {
  color:#f4d38a!important;
  font-size:25px;
  text-shadow:0 0 20px #dba85788;
}
.birthWheelCols {
  border-top:1px solid #b68b4d66;
  border-bottom:1px solid #b68b4d66;
  border-radius:16px;
  background:linear-gradient(90deg,
    #18122b,#29203c,#18122b);
}
.birthWheelItem.selected {
  color:#ffe09a!important;
  text-shadow:0 0 15px #e9ad58;
}
#birthWheelDone {
  background:linear-gradient(110deg,
    #c99b50,#ffe3a1,#c99b50)!important;
  box-shadow:0 0 24px #d5a25777;
  color:#26182f!important;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天命の導き｜運命鑑定</title>
<style>
body{margin:0;background:#101025;color:white;font-family:sans-serif;padding:24px}
main{max-width:480px;margin:40px auto}
h1{text-align:center;color:#eac783}
p{text-align:center;color:#c9c4da}
label{display:block;margin-top:20px}
input,textarea{box-sizing:border-box;width:100%;padding:15px;margin-top:8px;border:1px solid #78669b;border-radius:10px;font-size:16px}
textarea{height:110px}
button{width:100%;padding:17px;margin-top:25px;background:#eac783;border:0;border-radius:12px;font-size:18px;font-weight:bold}
#result{white-space:pre-wrap;line-height:1.9;margin-top:28px}

/* AI運命鑑定 プレミアムデザイン */
body {
  background: linear-gradient(160deg,#101025,#201637);
  color: #f8f5ff;
  font-family: -apple-system, sans-serif;
}
main {
  max-width: 480px;
  margin: 35px auto;
  padding: 0 20px 60px;
}
h1 {
  color: #eac783;
  font-size: 30px;
  text-shadow: 0 0 20px #a77c4670;
}
#result {
  white-space: pre-wrap;
  line-height: 2;
  margin-top: 35px;
  padding: 24px 18px;
  background: #211b38;
  border: 1px solid #776044;
  border-radius: 18px;
  overflow-wrap: anywhere;
}
button {
  background: linear-gradient(120deg,#eac783,#c99a4b);
  color: #24182e;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
}
input, textarea {
  border-radius: 10px;
  padding: 12px;
  font-size: 16px;
}
  
</style>
<style>
body {
  background: #100e23 url("./tenmei-free-bg-exact.webp")
    center top / cover no-repeat !important;
  background-attachment: scroll !important;
}
</style>
  </head>
<body>
<main>
<h1>✦ 天命の導き ✦</h1>
<p>あなたの未来に光を</p>
<form id="form">
<label>お名前<input id="name" required></label>

<label for="birthday">生年月日</label>
<input type="date" id="birthday" name="birthday" required
  style="width:100%;padding:14px;font-size:18px;">
<label for="category">相談ジャンル</label>
<select id="category" required style="box-sizing:border-box;width:100%;padding:14px;margin-top:8px;background:#211832;color:white;border:1px solid #c9a05d;border-radius:12px;font-size:16px;">
<option value="">相談ジャンルを選択してください</option>
<option value="恋愛・結婚">恋愛・結婚</option>
<option value="仕事・転職・独立">仕事・転職・独立</option>
<option value="金運・お金">金運・お金</option>
<option value="人生・人間関係">人生・人間関係</option>
</select>
<label>相談したいこと<textarea id="question" required></textarea></label>
<button id="submit">運命を鑑定する</button>
</form>
<div id="result" aria-live="polite"></div>

<div id="premium" style="display:none;margin-top:30px;padding:25px 18px;border:1px solid #eac783;border-radius:18px;background:#211b35;text-align:center;">
  <h2 style="color:#eac783;font-size:clamp(12px,4.6vw,24px);font-weight:800;text-align:center;white-space:nowrap;letter-spacing:-0.5px;margin:0 0 28px;text-shadow:0 0 15px #a77c4670;">さらに深く知りたいあなたへ</h2>
  <h2 id="premiumTitle" style="color:#eac783;">✦ 本格運命鑑定 ✦</h2>
  <p id="premiumLead" style="color:white;">あなたの運命を、さらに深く。</p>
  <p style="color:#ddd;line-height:1.8;text-align:left;">
    3か月・半年・1年の運勢と、
    あなたに合わせた具体的な開運アドバイスをお届けします。
  </p>
  <h2 style="color:#eac783;">980円（税込）</h2>
  <button type="button" disabled>本格鑑定へ進む（準備中）</button>
  <p style="font-size:12px;color:#ccc;">買い切り・月額料金なし</p>
</div>

</main>
<script>
const API="https://ai-fortune-api.karen-nayuta-kanata.workers.dev/fortune";
document.getElementById("form").addEventListener("submit",async e=>{
e.preventDefault();
const btn=document.getElementById("submit");
const result=document.getElementById("result");
btn.disabled=true;
result.textContent="鑑定中です...";
try{
const response=await fetch(API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:document.getElementById("name").value,
birthday: document.getElementById("birthday").value,
question:document.getElementById("question").value,
category:document.getElementById("category").value,
plan:"free" 
})
});
if(!response.ok)throw Error("HTTP "+response.status);
const data=await response.json();
const category = document.getElementById("category").value;
const premiumMessages = {
  "恋愛・結婚": [
    "✦ 本格恋愛・相性鑑定 ✦",
    "あの人との相性、二人の関係性、これからの恋愛運をさらに深く読み解きます。"
  ],
  "仕事・転職・独立": [
    "✦ 本格仕事運鑑定 ✦",
    "あなたの才能や適職、転職・独立の可能性、今後の仕事運を詳しく読み解きます。"
  ],
  "金運・お金": [
    "✦ 本格金運鑑定 ✦",
    "あなたの金運の傾向、お金との向き合い方、豊かさにつながる行動のヒントを詳しく読み解きます。"
  ],
  "人生・人間関係": [
    "✦ 本格人生鑑定 ✦",
    "人生の転機、人間関係、自分らしい生き方と今後の運勢を詳しく読み解きます。"
  ]
};
const premiumMessage = premiumMessages[category];
if (premiumMessage) {
  document.getElementById("premiumTitle").textContent = premiumMessage[0];
  document.getElementById("premiumLead").textContent = premiumMessage[1];
}
result.textContent=(data.fortune||"鑑定結果を取得できませんでした").split(/【さらに深く知りたいあなたへ】|【もっと深く知りたいあなたへ】/)[0].trim();
document.getElementById("premium").style.display = data.fortune ? "block" : "none";
}catch(err){
result.textContent="通信エラーが発生しました。APIの設定を確認してください。";
}finally{
btn.disabled=false;
}
});
</script>
<style>
#birthWheelOverlay{position:fixed;inset:0;background:#0009;z-index:9999;display:none;align-items:flex-end;justify-content:center}
#birthWheelPanel{background:#211a36;color:white;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 16px 35px;box-sizing:border-box}
#birthWheelPanel h3{text-align:center;color:#eac783;margin:0 0 18px}
.birthWheelCols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.birthWheelCol{height:220px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.birthWheelCol::-webkit-scrollbar{display:none}
.birthWheelItem{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:19px;color:#c5bdd4}
.birthWheelItem.selected{color:#eac783;font-weight:bold;font-size:23px}
#birthWheelDone{width:100%;background:#d9ab60;color:#211a36;border:0;border-radius:12px;padding:15px;font-size:19px;font-weight:bold;margin-top:18px}
</style>
<script>
(function(){
const input=document.getElementById("birthday");
if(!input)return;
input.type="text";
input.readOnly=true;
input.placeholder="タップして生年月日を選択";
input.style.cursor="pointer";
const overlay=document.createElement("div");
overlay.id="birthWheelOverlay";
overlay.innerHTML='<div id="birthWheelPanel"><h3>生年月日を選択</h3><div class="birthWheelCols"><div class="birthWheelCol" id="bwYear"></div><div class="birthWheelCol" id="bwMonth"></div><div class="birthWheelCol" id="bwDay"></div></div><button type="button" id="birthWheelDone">決定</button></div>';
document.body.appendChild(overlay);
const now=new Date();
let selected=[1985,1,1];
const cols=["bwYear","bwMonth","bwDay"].map(id=>document.getElementById(id));
function daysInMonth(y,m){return new Date(y,m,0).getDate()}
function renderCol(index,values){
const col=cols[index];
col.innerHTML="";
const spacer=()=>{const d=document.createElement("div");d.style.height="88px";return d};
col.appendChild(spacer());
values.forEach(v=>{
const d=document.createElement("div");
d.className="birthWheelItem";
d.dataset.value=v;
d.textContent=v+["年","月","日"][index];
col.appendChild(d);
});
col.appendChild(spacer());
}
function renderDays(){
const max=daysInMonth(selected[0],selected[1]);
selected[2]=Math.min(selected[2],max);
renderCol(2,Array.from({length:max},(_,i)=>i+1));
scrollToValue(2);
}
function scrollToValue(i){
const col=cols[i];
const item=Array.from(col.querySelectorAll(".birthWheelItem")).find(el=>Number(el.dataset.value)===selected[i]);
if(item)col.scrollTop=item.offsetTop-col.firstElementChild.offsetTop-88;
highlight(i);
}
function highlight(i){
cols[i].querySelectorAll(".birthWheelItem").forEach(el=>el.classList.toggle("selected",Number(el.dataset.value)===selected[i]));
}
renderCol(0,Array.from({length:now.getFullYear()-1899},(_,i)=>1900+i));
renderCol(1,Array.from({length:12},(_,i)=>i+1));
renderDays();
cols.forEach((col,i)=>{
let timer;
col.addEventListener("scroll",()=>{
clearTimeout(timer);
timer=setTimeout(()=>{
const items=Array.from(col.querySelectorAll(".birthWheelItem"));
const center=col.scrollTop+col.clientHeight/2;
let nearest=items[0],dist=Infinity;
items.forEach(el=>{
const d=Math.abs(el.offsetTop-col.offsetTop+el.offsetHeight/2-center);
if(d<dist){dist=d;nearest=el}
});
if(!nearest)return;
selected[i]=Number(nearest.dataset.value);
highlight(i);
if(i<2)renderDays();
},90);
});
});
input.addEventListener("click",()=>{
const m=input.value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
if(m)selected=m.slice(1).map(Number);
overlay.style.display="flex";
renderDays();
requestAnimationFrame(()=>cols.forEach((_,i)=>scrollToValue(i)));
});
overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.style.display="none"});
document.getElementById("birthWheelDone").addEventListener("click",()=>{
const pad=n=>String(n).padStart(2,"0");
const iso=selected[0]+"-"+pad(selected[1])+"-"+pad(selected[2]);
input.value=iso;
input.dispatchEvent(new Event("change",{bubbles:true}));
overlay.style.display="none";
});
})();
</script>
</body>
</html>
