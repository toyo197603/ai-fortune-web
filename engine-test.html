<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天命の導き｜計算エンジン検証</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }
    h1 { font-size: 22px; }
    button {
      padding: 15px;
      background: #183b66;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      width: 100%;
    }
    pre {
      background: white;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>天命の導き｜計算テスト</h1>
  <p>四柱推命の計算結果を確認します。</p>
  <button onclick="runTest()">計算テストを実行</button>
  <pre id="result">ボタンを押してください。</pre>

  <script src="./tenmei-engine.js"></script>
  <script>
    function runTest() {
      const output = document.getElementById("result");

      try {
        if (typeof tenmeiRunTest !== "function") {
          throw new Error("tenmeiRunTest が見つかりません");
        }

        const results = tenmeiRunTest();
        output.textContent = JSON.stringify(results, null, 2);
      } catch (error) {
        output.textContent = "エラー: " + error.message;
      }
    }
  </script>
</body>
</html>
